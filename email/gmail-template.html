<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stenth email template</title>
</head>
<body style="margin:0;padding:24px 0;background:#F2F8FC;">
<!-- Open in Chrome, Ctrl+A, Ctrl+C, paste into a Gmail compose window. Replace the [bracketed] text. -->
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center" style="width:600px;max-width:100%;border-collapse:collapse;background:#ffffff;border:1px solid #dde6ee;">
  <tr>
    <td style="background:#01080F;padding:20px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td style="padding:0 12px 0 0;vertical-align:middle;">
            <img src="https://www.stenth.com/Logo.png" width="36" height="36" alt="Stenth" style="display:block;border:0;width:36px;height:36px;">
          </td>
          <td style="vertical-align:middle;font-family:Inter,Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;letter-spacing:2px;color:#ffffff;">
            STENTH
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="background:#6F9CEB;height:3px;line-height:3px;font-size:0;">&nbsp;</td>
  </tr>
  <tr>
    <td style="padding:36px 32px 8px 32px;font-family:Inter,Arial,Helvetica,sans-serif;color:#01080F;">
      <p style="margin:0 0 20px 0;font-size:22px;line-height:30px;font-weight:700;color:#01080F;">[Subject line or headline]</p>
      <p style="margin:0 0 16px 0;font-size:15px;line-height:24px;color:#1f2933;">Hi [Client name],</p>
      <p style="margin:0 0 16px 0;font-size:15px;line-height:24px;color:#1f2933;">[First paragraph. Say why you're writing in one or two sentences.]</p>
      <p style="margin:0 0 24px 0;font-size:15px;line-height:24px;color:#1f2933;">[Second paragraph. The details, the update, or what you need from them.]</p>
    </td>
  </tr>
  <tr>
    <td style="padding:0 32px 32px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td style="background:#6F9CEB;border-radius:6px;">
            <a href="https://www.stenth.com" style="display:inline-block;padding:12px 24px;font-family:Inter,Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#01080F;text-decoration:none;">[Button text]</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr>
    <td style="padding:0 32px 32px 32px;font-family:Inter,Arial,Helvetica,sans-serif;">
      <p style="margin:0 0 4px 0;font-size:15px;line-height:24px;color:#1f2933;">Best,</p>
      <p style="margin:0;font-size:15px;line-height:22px;font-weight:700;color:#01080F;">[Your name]</p>
      <p style="margin:0;font-size:13px;line-height:20px;color:#8b929b;">[Your role], Stenth</p>
    </td>
  </tr>
  <tr>
    <td style="background:#01080F;padding:18px 32px;font-family:Inter,Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#8b929b;">
      <a href="https://www.stenth.com" style="color:#6F9CEB;text-decoration:none;font-weight:700;">stenth.com</a>
      &nbsp;&middot;&nbsp;
      <a href="mailto:info@stenth.com" style="color:#8b929b;text-decoration:none;">info@stenth.com</a>
    </td>
  </tr>
</table>
</body>
</html>
