<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stenth email signature</title>
</head>
<body style="margin:0;padding:24px;background:#ffffff;">
<!-- Open in Chrome, Ctrl+A, Ctrl+C, paste into Gmail Settings > General > Signature. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Inter,Arial,Helvetica,sans-serif;">
  <tr>
    <td style="padding:0 14px 0 0;vertical-align:top;border-right:3px solid #6F9CEB;">
      <img src="https://www.stenth.com/Logo.png" width="48" height="48" alt="Stenth" style="display:block;border:0;width:48px;height:48px;">
    </td>
    <td style="padding:0 0 0 14px;vertical-align:top;">
      <p style="margin:0;font-size:15px;line-height:20px;font-weight:700;color:#01080F;">[Your name]</p>
      <p style="margin:0 0 6px 0;font-size:13px;line-height:18px;color:#8b929b;">[Your role], Stenth</p>
      <p style="margin:0;font-size:13px;line-height:18px;">
        <a href="https://www.stenth.com" style="color:#6F9CEB;text-decoration:none;font-weight:700;">stenth.com</a>
        <span style="color:#8b929b;">&nbsp;&middot;&nbsp;</span>
        <a href="mailto:info@stenth.com" style="color:#01080F;text-decoration:none;">info@stenth.com</a>
      </p>
    </td>
  </tr>
</table>
</body>
</html>
